name: Build AI Builder Next
on:
  push:
    branches: ['ai-builder-next']
    paths: ['AIBuilderNext/**', '.github/workflows/aibuilder-next.yml']
  pull_request:
    paths: ['AIBuilderNext/**', '.github/workflows/aibuilder-next.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
      - name: Compile and test
        run: gradle -p AIBuilderNext build --no-daemon
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aibuilder-next-tests
          path: |
            AIBuilderNext/build/test-results
            AIBuilderNext/build/reports/tests
      - name: Installable Fabric mod and sources
        uses: actions/upload-artifact@v7
        with:
          name: aibuilder-next-1.21.1
          path: AIBuilderNext/build/libs/*.jar
          if-no-files-found: error
