name: Build AI Builder Fabric
on:
  push:
    branches: ['ai-builder', 'ai-builder-v2-architecture']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
      - name: Compile AI Builder Fabric 1.21.1
        run: gradle -p AIBuilder build --no-daemon
      - name: Print detailed JUnit failures if any
        if: failure()
        run: |
          for report in AIBuilder/build/test-results/test/*.xml; do
            if [ -f "$report" ]; then
              echo "--- $report ---"
              sed -n '1,160p' "$report"
            fi
          done
      - name: Test common AI material aliases
        run: |
          mkdir -p /tmp/aibuilder-alias-tests
          javac -d /tmp/aibuilder-alias-tests AIBuilder/src/main/java/dev/aibuilder/MaterialAliases.java AIBuilder/tests/dev/aibuilder/MaterialAliasesSmokeTest.java
          java -cp /tmp/aibuilder-alias-tests dev.aibuilder.MaterialAliasesSmokeTest
      - name: Pack complete AI Builder V2 source project
        run: |
          zip -q -r AIBuilder-V2-Source-0.11.0-alpha.1.zip AIBuilder/build.gradle AIBuilder/settings.gradle AIBuilder/gradle.properties AIBuilder/src AIBuilder/README_RU.md AIBuilder/README.md AIBuilder/V2_README_RU.md .github/workflows/aibuilder.yml
      - name: Upload AI Builder V2 sources
        uses: actions/upload-artifact@v7
        with:
          name: AIBuilder-V2-Source
          path: AIBuilder-V2-Source-0.11.0-alpha.1.zip
          if-no-files-found: error
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: AIBuilder-V2-Architecture-1.21.1
          path: AIBuilder/build/libs/aibuilder-fabric-0.11.0-alpha.1.jar
          if-no-files-found: error
